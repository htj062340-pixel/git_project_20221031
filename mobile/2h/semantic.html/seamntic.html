<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미디어 쿼리 정의</title>
    <style>
        /* 기본 스타일 (모바일 / 가장 작은 화면) */
        body {
            background-color: #61a646; /* 진한 연두색/초록색 */
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            margin: 0;
        }

        /* 중간 화면 (태블릿 크기) - 배경색 노란색/연두색으로 변경 */
        @media screen and (min-width: 600px) and (max-width: 1024px) {
            body {
                background-color: #dbe878; /* 연한 노란빛 연두색 */
                color: #333333;
            }
        }

        /* 큰 화면 (데스크톱 크기) - 배경색 보라색으로 변경 */
        @media screen and (min-width: 1025px) {
            body {
                background-color: #5d348b; /* 보라색 */
                color: #ffffff;
            }
        }
    </style>
</head>
<body>

    <h1>미디어 쿼리</h1>
    <p>반응형 웹에 대한 예</p>

</body>
</html>
