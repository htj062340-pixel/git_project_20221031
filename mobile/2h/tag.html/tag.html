<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>목록 태그와 테이블 태그</title>

    <style>
        table {
            border-collapse: collapse;
        }

        td {
            border: 3px double black;
            padding: 5px;
            text-align: center;
        }

        ol {
            list-style-type: upper-roman;
        }

        hr {
            margin: 30px 0;
        }

        a {
            display: block;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <h1>목록 태그</h1>

    <ul>
        <li>마크업 언어
            <ol>
                <li>HTML</li>
                <li>XML</li>
                <li>SGML</li>
            </ol>
        </li>

        <li>Web Browser
            <ol>
                <li>Internet Explorer</li>
                <li>Chrome</li>
                <li>Safari</li>
                <li>Firefox</li>
                <li>Opera</li>
            </ol>
        </li>
    </ul>

    <hr>

    <h1>테이블 태그</h1>

    <table>
        <tr>
            <td>셀(1,1)</td>
            <td>셀(1,2)</td>
            <td>셀(1,3)</td>
        </tr>

        <tr>
            <td rowspan="3">셀(2,1)</td>
            <td>셀(2,2)</td>
            <td>셀(2,3)</td>
        </tr>

        <tr>
            <td colspan="2">셀(3,1)</td>
        </tr>

        <tr>
            <td>셀(4,1)</td>
            <td>셀(4,2)</td>
        </tr>
    </table>

    <br>

    <a href="https://www.google.com">실행예제 → 구글사이트</a>
    <a href="https://www.naver.com">한국에서 많이 이용하는 포털사이트</a>
    <a href="https://www.google.com">웹브라우저에서 검색하기</a>

</body>
</html>
